name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  # Lets the `tests-passed` gate below read the Tests workflow's conclusion.
  actions: read

# Serialize runs: a burst of quick pushes used to run several release jobs
# concurrently, which computed the same next version and raced on
# `gh release create/upload` (one run went red). Cancel the older run when a
# newer push arrives — main is cumulative, so the latest run ships everything.
concurrency:
  group: build-and-release
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - name: Compute next version
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release list --limit 1 --json tagName -q '.[0].tagName' --repo "${{ github.repository }}" 2>/dev/null || echo "v1.0.0")
          LATEST="${LATEST#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
          PATCH=$((PATCH + 1))
          VER="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VER}"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $VER (code: $CODE, tag: $TAG)"

  build-mosh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache mosh binary
        id: mosh-cache
        uses: actions/cache@v4
        with:
          path: androidApp/src/main/jniLibs/arm64-v8a/libmosh.so
          key: mosh-client-arm64-v1

      - name: Install build dependencies
        if: steps.mosh-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool pkg-config protobuf-compiler

      - name: Setup Android NDK
        if: steps.mosh-cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3

      - name: Install NDK
        if: steps.mosh-cache.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;27.2.12479018"

      - name: Build mosh-client for arm64
        if: steps.mosh-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash build-mosh.sh "$ANDROID_NDK_HOME"
          ls -la androidApp/src/main/jniLibs/arm64-v8a/libmosh.so
          file androidApp/src/main/jniLibs/arm64-v8a/libmosh.so

      - name: Upload mosh binary
        uses: actions/upload-artifact@v4
        with:
          name: mosh-client-arm64
          path: androidApp/src/main/jniLibs/arm64-v8a/libmosh.so

  build-et:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache et binary
        id: et-cache
        uses: actions/cache@v4
        with:
          path: androidApp/src/main/jniLibs/arm64-v8a/libet.so
          # Bump the suffix to force a rebuild when build-et.sh or the ET pin changes.
          key: et-client-arm64-v7.0.0-3

      - name: Install build dependencies
        if: steps.et-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool pkg-config protobuf-compiler cmake

      - name: Setup Android NDK
        if: steps.et-cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3

      - name: Install NDK
        if: steps.et-cache.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;27.2.12479018"

      - name: Build et client for arm64
        if: steps.et-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash build-et.sh "$ANDROID_NDK_HOME"
          ls -la androidApp/src/main/jniLibs/arm64-v8a/libet.so
          file androidApp/src/main/jniLibs/arm64-v8a/libet.so

      - name: Upload et binary
        uses: actions/upload-artifact@v4
        with:
          name: et-client-arm64
          path: androidApp/src/main/jniLibs/arm64-v8a/libet.so

  build-et-linux:
    runs-on: ubuntu-latest
    # Build inside an OLD-glibc image (Ubuntu 22.04 = glibc 2.35) so the binary
    # runs on Debian 12 servers / older distros — a native ubuntu-latest build
    # requires glibc 2.39 and won't start on them.
    container: ubuntu:22.04
    # Best-effort: a failure here must not block the Linux desktop release —
    # the app just falls back to SSH when the bundled et is absent.
    continue-on-error: true
    steps:
      - name: Install toolchain
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git curl ca-certificates build-essential autoconf automake libtool pkg-config cmake unzip file zlib1g-dev
      - uses: actions/checkout@v4
      - name: Cache et-linux binary
        id: cache
        uses: actions/cache@v4
        with:
          path: desktopApp/src/main/resources/bin/et-linux-x64
          key: et-linux-x64-glibc235-v7.0.0-2
      - name: Build patched et for linux-x64 (static)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          bash build-et-desktop.sh "$PWD/desktopApp/src/main/resources/bin/et-linux-x64"
          file desktopApp/src/main/resources/bin/et-linux-x64
      - name: Upload et-linux binary
        uses: actions/upload-artifact@v4
        with:
          name: et-linux-x64
          path: desktopApp/src/main/resources/bin/et-linux-x64

  build-et-macos:
    runs-on: macos-latest
    # Best-effort (untested cross-arch build): must not block the macOS release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Cache et-macos binaries
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            desktopApp/src/main/resources/bin/et-macos-arm64
            desktopApp/src/main/resources/bin/et-macos-x64
          key: et-macos-v7.0.0-1
      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install autoconf automake libtool pkg-config cmake
      - name: Build patched et for macOS (arm64 + x86_64, static)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          bash build-et-desktop.sh "$PWD/desktopApp/src/main/resources/bin/et-macos-arm64" arm64
          bash build-et-desktop.sh "$PWD/desktopApp/src/main/resources/bin/et-macos-x64" x86_64
          file desktopApp/src/main/resources/bin/et-macos-*
      - name: Upload et-macos binaries
        uses: actions/upload-artifact@v4
        with:
          name: et-macos
          path: desktopApp/src/main/resources/bin/et-macos-*

  build-etserver-linux:
    runs-on: ubuntu-latest
    # Old-glibc image so the downloaded server binaries run on Debian 12 / older
    # servers (see build-et-linux).
    container: ubuntu:22.04
    # Best-effort server-side binaries (downloaded onto servers by the app's
    # etserver auto-install). A failure must not block the release.
    continue-on-error: true
    steps:
      - name: Install toolchain
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git curl ca-certificates build-essential autoconf automake libtool pkg-config cmake unzip file zlib1g-dev
      - uses: actions/checkout@v4
      - name: Cache etserver binaries
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            etsrv-out/etserver-linux-x64
            etsrv-out/etterminal-linux-x64
          key: etserver-linux-x64-glibc235-v7.0.0-2
      - name: Build static etserver + etterminal (linux-x64)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          TARGET=etserver    bash build-et-desktop.sh "$PWD/etsrv-out/etserver-linux-x64"
          TARGET=etterminal  bash build-et-desktop.sh "$PWD/etsrv-out/etterminal-linux-x64"
          file etsrv-out/*
      - name: Upload etserver binaries
        uses: actions/upload-artifact@v4
        with:
          name: etserver-linux
          path: etsrv-out/*

  build-android:
    runs-on: ubuntu-latest
    needs: [version, build-mosh, build-et]
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
      patch_files: ${{ steps.patch.outputs.patch_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download mosh binary
        uses: actions/download-artifact@v4
        with:
          name: mosh-client-arm64
          path: androidApp/src/main/jniLibs/arm64-v8a/

      - name: Download et binary
        uses: actions/download-artifact@v4
        with:
          name: et-client-arm64
          path: androidApp/src/main/jniLibs/arm64-v8a/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Update version in build.gradle.kts
        run: |
          VER="${{ needs.version.outputs.version }}"
          CODE="${{ needs.version.outputs.code }}"
          sed -i "s/versionCode = .*/versionCode = $CODE/" androidApp/build.gradle.kts
          sed -i "s/versionName = .*/versionName = \"$VER\"/" androidApp/build.gradle.kts
          # wearApp self-update (WearUpdater) compares its own
          # BuildConfig.VERSION_NAME against the latest release tag, so it
          # needs to track the same version as the phone.
          sed -i "s/versionCode = .*/versionCode = $CODE/" wearApp/build.gradle.kts
          sed -i "s/versionName = .*/versionName = \"$VER\"/" wearApp/build.gradle.kts

      - name: Build release APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Sign APK
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > /tmp/release.keystore
          APK=$(find androidApp/build -name "*.apk" -path "*/release/*" | head -1)
          BT="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | sort -V | tail -1)"

          ${BT}/zipalign -v 4 "$APK" /tmp/aligned.apk
          ${BT}/apksigner sign \
            --ks /tmp/release.keystore \
            --ks-key-alias clauderemote \
            --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --out ClaudeRemote.apk /tmp/aligned.apk
          ${BT}/apksigner verify ClaudeRemote.apk

      - name: Compute SHA-256
        id: hash
        run: |
          SHA=$(sha256sum ClaudeRemote.apk | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $SHA"

      - name: Generate delta patches (last 10 releases -> new)
        id: patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          sudo apt-get install -y -qq bsdiff
          NEW_VER="${{ needs.version.outputs.version }}"
          APK_SIZE=$(stat -c%s "ClaudeRemote.apk")
          export NEW_VER APK_SIZE REPO
          # Up to 10 most recent prior releases — generate a DIRECT patch from
          # each so a user up to 10 versions behind needs only ONE small patch.
          # Both phases run concurrently: bsdiff is CPU/RAM-heavy, so 10 serial
          # diffs would dominate the job; bounded parallelism keeps it under the
          # parallel macOS build's wall-clock.
          TAGS=$(gh release list --limit 10 --json tagName -q '.[].tagName' --repo "$REPO" 2>/dev/null || echo "")

          # Phase 1 — download each prior APK into its own dir, in parallel.
          for PREV_TAG in $TAGS; do
            PREV_VER="${PREV_TAG#v}"
            [ "$PREV_VER" = "$NEW_VER" ] && continue
            ( mkdir -p "/tmp/prev/$PREV_VER" &&
              gh release download "$PREV_TAG" --pattern "ClaudeRemote.apk" \
                --dir "/tmp/prev/$PREV_VER/" --repo "$REPO" 2>/dev/null || true ) &
          done
          wait

          # Phase 2 — bsdiff each prior APK -> new APK, max 4 concurrent.
          make_patch() {
            ver="$1"
            src="/tmp/prev/$ver/ClaudeRemote.apk"
            [ -f "$src" ] || return 0
            name="patch-${ver}-to-${NEW_VER}.bspatch"
            bsdiff "$src" ClaudeRemote.apk "$name" || { rm -f "$name"; return 0; }
            size=$(stat -c%s "$name")
            pct=$(( size * 100 / APK_SIZE ))
            if [ "$size" -lt "$((APK_SIZE * 80 / 100))" ]; then
              echo "keep $name ($pct% of APK)"
            else
              echo "skip $name — too large ($pct%)"
              rm -f "$name"
            fi
          }
          export -f make_patch
          if [ -d /tmp/prev ]; then
            ls /tmp/prev | xargs -r -P 4 -I {} bash -c 'make_patch "$@"' _ {}
          fi

          # Collect survivors via a literal-glob-safe loop (no `ls` under set -e).
          PATCH_FILES=""
          for f in patch-*-to-"${NEW_VER}".bspatch; do
            [ -f "$f" ] && PATCH_FILES="$PATCH_FILES $f"
          done
          echo "patch_files=${PATCH_FILES# }" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ClaudeRemote.apk

      - name: Build + Sign Wear OS companion APK (release — same keystore/pipeline as the phone, required for Data Layer sync)
        run: |
          ./gradlew :wearApp:assembleRelease
          APK=$(find wearApp/build -name "*.apk" -path "*/release/*" | head -1)
          BT="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | sort -V | tail -1)"

          ${BT}/zipalign -v 4 "$APK" /tmp/wear-aligned.apk
          ${BT}/apksigner sign \
            --ks /tmp/release.keystore \
            --ks-key-alias clauderemote \
            --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --out ClaudeRemoteWear.apk /tmp/wear-aligned.apk
          ${BT}/apksigner verify ClaudeRemoteWear.apk

          rm /tmp/release.keystore

      - name: Upload Wear APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wear-apk
          path: ClaudeRemoteWear.apk

      - name: Upload patch artifact
        if: steps.patch.outputs.patch_files != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-patch
          path: "*.bspatch"

  build-macos:
    runs-on: macos-latest
    needs: [version, build-et-macos]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download bundled et (macOS arm64 + x86_64)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: et-macos
          path: desktopApp/src/main/resources/bin/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Update version
        run: |
          VER="${{ needs.version.outputs.version }}"
          sed -i '' "s/packageVersion = .*/packageVersion = \"$VER\"/" desktopApp/build.gradle.kts

      - name: Generate macOS icon
        run: |
          SRC=desktopApp/src/main/resources/icon.png
          ICONSET=AppIcon.iconset
          mkdir -p "$ICONSET"
          sips -z 16 16 "$SRC" --out "$ICONSET/icon_16x16.png"
          sips -z 32 32 "$SRC" --out "$ICONSET/icon_16x16@2x.png"
          sips -z 32 32 "$SRC" --out "$ICONSET/icon_32x32.png"
          sips -z 64 64 "$SRC" --out "$ICONSET/icon_32x32@2x.png"
          sips -z 128 128 "$SRC" --out "$ICONSET/icon_128x128.png"
          sips -z 256 256 "$SRC" --out "$ICONSET/icon_128x128@2x.png"
          sips -z 256 256 "$SRC" --out "$ICONSET/icon_256x256.png"
          sips -z 512 512 "$SRC" --out "$ICONSET/icon_256x256@2x.png"
          sips -z 512 512 "$SRC" --out "$ICONSET/icon_512x512.png"
          cp "$SRC" "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o desktopApp/src/main/resources/icon.icns
          rm -rf "$ICONSET"

      - name: Build DMG
        run: ./gradlew :desktopApp:packageDmg -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Rename DMG
        run: |
          DMG=$(find desktopApp/build/compose/binaries/main/dmg -name "*.dmg" | head -1)
          cp "$DMG" ClaudeRemote-macOS.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ClaudeRemote-macOS.dmg

  build-linux:
    runs-on: ubuntu-latest
    needs: [version, build-et-linux]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download bundled et (linux-x64)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: et-linux-x64
          path: desktopApp/src/main/resources/bin/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Update version
        run: |
          VER="${{ needs.version.outputs.version }}"
          sed -i "s/packageVersion = .*/packageVersion = \"$VER\"/" desktopApp/build.gradle.kts

      - name: Build Linux distributable + deb
        run: ./gradlew :desktopApp:createDistributable :desktopApp:packageDeb -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Package portable tarball (Arch/Manjaro PKGBUILD source) + collect deb
        run: |
          APPDIR=$(find desktopApp/build/compose/binaries/main/app -maxdepth 1 -mindepth 1 -type d | head -1)
          echo "App image: $APPDIR"
          tar -czf claude-remote-linux-x64.tar.gz -C "$(dirname "$APPDIR")" "$(basename "$APPDIR")"
          DEB=$(find desktopApp/build/compose/binaries/main/deb -name "*.deb" | head -1)
          cp "$DEB" claude-remote-linux.deb
          ls -lh claude-remote-linux-x64.tar.gz claude-remote-linux.deb

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            claude-remote-linux-x64.tar.gz
            claude-remote-linux.deb

  package-manjaro:
    runs-on: ubuntu-latest
    needs: [version, build-linux]
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux tarball
        uses: actions/download-artifact@v4
        with:
          name: linux-dist

      - name: Build pacman package (.pkg.tar.zst) in Arch container
        env:
          VER: ${{ needs.version.outputs.version }}
        run: |
          # makepkg refuses to run as root, so build inside an Arch container as
          # a dedicated unprivileged user. Native ubuntu actions already fetched
          # the repo + tarball; here we only assemble sources and run makepkg.
          docker run --rm -v "$PWD":/work -w /work -e VER="$VER" archlinux:latest bash -euo pipefail -c '
            pacman -Syu --noconfirm base-devel >/dev/null
            useradd -m builder
            mkdir -p pkgbuild
            cp packaging/manjaro/PKGBUILD packaging/manjaro/claude-remote.desktop pkgbuild/
            cp claude-remote-linux-x64.tar.gz pkgbuild/
            cp desktopApp/src/main/resources/icon.png pkgbuild/
            sed -i "s/^pkgver=.*/pkgver=${VER}/" pkgbuild/PKGBUILD
            chown -R builder:builder pkgbuild
            cd pkgbuild && sudo -u builder makepkg -f --noconfirm --skipinteg --nodeps
            ls -lh *.pkg.tar.zst
          '
          cp pkgbuild/*.pkg.tar.zst .
          ls -lh *.pkg.tar.zst

      - name: Upload Manjaro package
        uses: actions/upload-artifact@v4
        with:
          name: manjaro-pkg
          path: "*.pkg.tar.zst"

  # The brake on a bad release, without a brake on pushing.
  #
  # A required status check on `main` would be the textbook answer, but it does
  # not fit this repo: work is pushed straight to main, and GitHub refuses a push
  # to a protected branch whose required checks haven't passed for that commit —
  # which they cannot have, since they only run once the commit exists. It would
  # force every change through a pull request.
  #
  # So gate the RELEASE instead of the push. This waits for the Tests workflow
  # run for this exact SHA and fails if it did not succeed, which blocks the
  # `release` job below. It costs no wall-clock: the builds take ~7 min and Tests
  # ~1.5-4 min, so the result is already in by the time the builds finish.
  tests-passed:
    runs-on: ubuntu-latest
    steps:
      - name: Require the Tests workflow to have passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="repos/${{ github.repository }}/actions/workflows/tests.yml/runs?head_sha=${{ github.sha }}"
          # ~10 min of polling: comfortably longer than a cold Tests run (~4 min),
          # and still well inside the build jobs this gate runs beside.
          for i in $(seq 1 60); do
            RUN=$(gh api "$API" --jq '[.workflow_runs[] | select(.event=="push")] | first // empty' 2>/dev/null || echo "")
            if [ -n "$RUN" ]; then
              STATUS=$(echo "$RUN" | jq -r '.status')
              CONCL=$(echo "$RUN" | jq -r '.conclusion // ""')
              URL=$(echo "$RUN" | jq -r '.html_url')
              if [ "$STATUS" = "completed" ]; then
                case "$CONCL" in
                  success)
                    echo "Tests passed for ${{ github.sha }} — $URL"
                    exit 0 ;;
                  cancelled|skipped)
                    # A newer push superseded this commit; that run's own
                    # concurrency group cancels this release too. Don't publish
                    # off an unverified commit.
                    echo "::error::Tests were $CONCL for this commit — $URL"
                    exit 1 ;;
                  *)
                    echo "::error::Tests $CONCL for this commit — refusing to release. $URL"
                    exit 1 ;;
                esac
              fi
              echo "Tests $STATUS ($i/60) — $URL"
            else
              echo "waiting for the Tests run for ${{ github.sha }} to appear ($i/60)"
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for the Tests workflow on ${{ github.sha }}."
          exit 1

  release:
    runs-on: ubuntu-latest
    needs: [version, tests-passed, build-android, build-macos, build-linux, package-manjaro, build-etserver-linux]
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Download patch
        if: needs.build-android.outputs.patch_files != ''
        uses: actions/download-artifact@v4
        with:
          name: android-patch

      - name: Download Wear APK
        uses: actions/download-artifact@v4
        with:
          name: wear-apk

      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-dist

      - name: Download Manjaro package
        uses: actions/download-artifact@v4
        with:
          name: manjaro-pkg

      - name: Download etserver binaries (server-side, may be absent)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: etserver-linux

      - name: Create release with all artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          SHA="${{ needs.build-android.outputs.sha256 }}"

          # Use the authoritative list the build job computed, existence-guarded
          # (more robust than re-globbing the runner's cwd).
          PATCHES=""
          for f in ${{ needs.build-android.outputs.patch_files }}; do
            [ -f "$f" ] && PATCHES="$PATCHES $f"
          done
          # Pacman package name carries version + arch, so resolve it via glob.
          PKG=""
          for f in claude-remote-*-x86_64.pkg.tar.zst; do
            case "$f" in *-debug-*) continue;; esac   # never ship the debug-symbols split
            [ -f "$f" ] && PKG="$f"
          done
          # Server-side etserver binaries (best-effort — the app downloads these
          # onto servers for the etserver auto-install). Existence-guarded.
          ETSRV=""
          for f in etserver-linux-x64 etterminal-linux-x64; do
            [ -f "$f" ] && ETSRV="$ETSRV $f"
          done
          ASSETS="ClaudeRemote.apk ClaudeRemoteWear.apk ClaudeRemote-macOS.dmg claude-remote-linux-x64.tar.gz claude-remote-linux.deb $PKG$PATCHES$ETSRV"

          if gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; then
            echo "Release $TAG exists, uploading assets..."
            gh release upload "$TAG" $ASSETS --clobber --repo "${{ github.repository }}"
            gh release edit "$TAG" --notes "sha256:$SHA" --repo "${{ github.repository }}"
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" $ASSETS \
              --target "${{ github.sha }}" \
              --title "$TAG" \
              --notes "sha256:$SHA" \
              --repo "${{ github.repository }}"
          fi
