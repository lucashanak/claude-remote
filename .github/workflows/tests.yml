name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deliberately a SEPARATE workflow from build-and-release, with its own
# concurrency group. It runs alongside the release jobs so it never delays a
# release, and a burst of pushes cancelling release runs (that workflow uses
# cancel-in-progress on one shared group) can't take the test runs down with it.
#
# Trade-off, stated plainly: because nothing here gates the release, a failing
# test does NOT stop a release from shipping. Make this job a required status
# check on main if you want that brake back — it blocks the merge without
# slowing the release, since it still runs in parallel.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ONE job on purpose. This was split into parallel `unit` and `integration`
  # jobs, which measured ~166s each — but only 1.1s and 8.5s of that was
  # actually running tests. The rest was Kotlin compilation plus runner setup,
  # and BOTH jobs paid for it: :shared was compiled twice (~60s each), on top of
  # two Android SDK installs (~20s) and two Gradle setups (~9s).
  #
  # The Gradle build cache can't fix that, because the two jobs ran in parallel:
  # the second starts before the first has written any cache. Sharing one job
  # does fix it — `build/` persists across steps, so the later steps reuse the
  # compilation the first one did.
  #
  # Cost of merging: the lanes are now serial, so wall-clock goes up slightly.
  # That is free in practice — the release workflow takes ~7 min and this runs
  # beside it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # :shared applies com.android.library, so Gradle configuration needs the
      # Android SDK even to run the desktop-only test tasks.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # shellcheck: RestoreScriptSyntaxTest lints the embedded restore/drift
      #   scripts with it (bash -n runs unconditionally).
      # openssh-server/tmux/jq: the integration harness starts its OWN sshd on a
      #   high port as the current user, and restore.sh needs tmux + jq.
      # mosh: so the transport test has a real mosh-server to invoke.
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck openssh-server tmux jq mosh
          tmux -V && jq --version && shellcheck --version | head -2

      - name: Unit tests
        run: ./gradlew :shared:desktopTest

      # The debug pipeline does NOT catch missing icon imports, cross-module
      # `internal` access, sealed-state inference or R-namespace breakage —
      # only a release compile does.
      #
      # `!cancelled()` on this and the step below: one push should surface every
      # failure at once, rather than making you fix the unit tests and push
      # again just to discover the integration lane is broken too.
      - name: Release-variant compile check
        if: '!cancelled()'
        run: >-
          ./gradlew :shared:compileReleaseKotlinAndroid
          :androidApp:compileReleaseKotlin
          :wearApp:compileReleaseKotlin

      # Real sshd + real tmux + the real embedded restore.sh.
      #
      # NOT covered: the Claude Code CLI itself. It needs OAuth and would draw on
      # a capped subscription credit pool, so the harness puts a stand-in
      # `claude` on PATH — these tests validate OUR session/restore logic.
      - name: Integration tests
        if: '!cancelled()'
        run: ./gradlew :shared:integrationTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
          if-no-files-found: ignore

      # The harness writes sshd/tmux/restore logs here; without them a CI-only
      # integration failure is close to undiagnosable.
      - name: Upload harness diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-diagnostics
          path: shared/build/integration-logs/
          if-no-files-found: ignore
