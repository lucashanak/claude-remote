name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deliberately a SEPARATE workflow from build-and-release, with its own
# concurrency group. It runs alongside the release jobs so the builds do not wait for
# it, and a burst of pushes cancelling release runs (that workflow uses
# cancel-in-progress per ref) cannot take the test runs down with it.
#
# The release is gated on this workflow: build-and-release.yml job `tests-passed`
# (scripts/ci/tests-gate.sh) waits for the push run of the same SHA and fails the
# release unless it succeeded. The two still run in parallel; the gate only holds
# back the final `release` job.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# No job here needs to write anything or read a secret (the Go job below runs on fork PRs too).
permissions:
  contents: read

jobs:
  # ONE job on purpose. This was split into parallel `unit` and `integration`
  # jobs, which measured ~166s each — but only 1.1s and 8.5s of that was
  # actually running tests. The rest was Kotlin compilation plus runner setup,
  # and BOTH jobs paid for it: :shared was compiled twice (~60s each), on top of
  # two Android SDK installs (~20s) and two Gradle setups (~9s).
  #
  # The Gradle build cache can't fix that, because the two jobs ran in parallel:
  # the second starts before the first has written any cache. Sharing one job
  # does fix it — `build/` persists across steps, so the later steps reuse the
  # compilation the first one did.
  #
  # Cost of merging: the lanes are now serial, so wall-clock goes up slightly.
  # That is free in practice — the release workflow takes ~7 min and this runs
  # beside it.
  #
  # The Go daemon (`crd` job below) is the one exception, and it keeps the reason
  # above true: it shares no compilation with the Kotlin lanes (own toolchain, own
  # module), so a second job costs nothing extra and finishes long before `test`.
  # A failed `crd` job still fails this workflow run, which is what tests-gate.sh
  # reads for the release.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # :shared applies com.android.library, so Gradle configuration needs the
      # Android SDK even to run the desktop-only test tasks.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The v3 tag still defaults to `packages: tools platform-tools`, and
          # Google removed the legacy `tools` package from the SDK repository —
          # sdkmanager then exits 1 and every Android job dies at setup. Naming
          # the packages explicitly (what the action's own main branch now
          # defaults to) is what unbreaks it; nothing here needs `tools`, the
          # NDK steps use sdkmanager out of cmdline-tools.
          packages: platform-tools

      # shellcheck: RestoreScriptSyntaxTest lints the embedded restore/drift
      #   scripts with it (bash -n runs unconditionally).
      # openssh-server/tmux/jq: the integration harness starts its OWN sshd on a
      #   high port as the current user, and restore.sh needs tmux + jq.
      # mosh: so the transport test has a real mosh-server to invoke.
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck openssh-server tmux jq mosh
          tmux -V && jq --version && shellcheck --version | head -2

      - name: Unit tests
        run: ./gradlew :shared:desktopTest

      # The debug pipeline does NOT catch missing icon imports, cross-module
      # `internal` access, sealed-state inference or R-namespace breakage —
      # only a release compile does.
      #
      # `!cancelled()` on this and the step below: one push should surface every
      # failure at once, rather than making you fix the unit tests and push
      # again just to discover the integration lane is broken too.
      - name: Release-variant compile check
        if: '!cancelled()'
        run: >-
          ./gradlew :shared:compileReleaseKotlinAndroid
          :androidApp:compileReleaseKotlin
          :wearApp:compileReleaseKotlin

      # Real sshd + real tmux + the real embedded restore.sh.
      #
      # NOT covered: the Claude Code CLI itself. It needs OAuth and would draw on
      # a capped subscription credit pool, so the harness puts a stand-in
      # `claude` on PATH — these tests validate OUR session/restore logic.
      - name: Integration tests
        if: '!cancelled()'
        run: ./gradlew :shared:integrationTest

      # Jarvis read layer (tools/jarvis): stdlib Python, hermetic (temp HOME, fake tmux and liveness), ~1 s.
      # Last and `!cancelled()` so it runs and reports even when a Gradle lane above failed.
      - name: Jarvis CLI tests
        if: '!cancelled()'
        run: python3 -m unittest discover -s tools/jarvis -v

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
          if-no-files-found: ignore

      # The harness writes sshd/tmux/restore logs here; without them a CI-only
      # integration failure is close to undiagnosable.
      - name: Upload harness diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-diagnostics
          path: shared/build/integration-logs/
          if-no-files-found: ignore

  # Go daemon crd (docs/crd.md, spec B0 §7.1). Invariants checked by scripts/ci/test-tests-gate.sh (run below):
  # no `needs`, no `if`, no `continue-on-error`, a timeout, the workflow has no `paths` filter — a skipped or
  # tolerated Go failure would let a release through, a missing run would block every release.
  crd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      # tests that need a real tmux skip without one locally; here a skip is a failure
      CRD_REQUIRE_TMUX: '1'
    defaults:
      run:
        working-directory: crd
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go (pinned in crd/go.version)
        uses: actions/setup-go@v5
        with:
          go-version-file: crd/go.version
          check-latest: false
          cache: false

      - name: Toolchain pin
        run: |
          test "$(go env GOVERSION)" = "go$(cat go.version)"
          grep -qx "go $(cat go.version)" go.mod
          if grep -q '^toolchain' go.mod; then echo "go.mod must not name a toolchain"; exit 1; fi

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux python3-yaml
          tmux -V

      - name: Workflow and release-gate invariants
        working-directory: .
        run: bash scripts/ci/test-tests-gate.sh

      - name: Golden vectors (protocol/crp/golden)
        working-directory: protocol/crp/golden
        run: python3 -I gen.py --check

      - name: crdlint (tmux gate, codec writer, signals, test harness rules)
        run: go run ./tools/crdlint .

      - name: The crd binary does not contain the test harness
        run: |
          go list -deps ./cmd/crd > deps.txt
          if grep -q '/internal/testenv$' deps.txt; then echo "cmd/crd depends on internal/testenv"; exit 1; fi
          grep -q '/internal/daemon$' deps.txt

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: CGO_ENABLED=1 go test -race -count=1 -timeout 10m ./...

      - name: go test, CGO_ENABLED=0 (the shipped configuration)
        run: CGO_ENABLED=0 go test -count=1 -timeout 10m ./...

      - name: Static binary
        run: |
          CGO_ENABLED=0 go build -trimpath -o crd-linux-amd64 ./cmd/crd
          file crd-linux-amd64
          file crd-linux-amd64 | grep -q 'statically linked'
          if ldd crd-linux-amd64; then echo "crd is not static"; exit 1; fi
          ./crd-linux-amd64 version
