org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.configuration-cache=true
# Reuse task OUTPUTS (compiled classes, test results) across builds and across CI
# runs — the configuration cache above only skips Gradle's configuration phase.
# CI recompiles from a clean checkout every run, and ~100s of a ~166s test job is
# Kotlin compilation, so this is where the time actually is.
# NOTE: a task that reads files Gradle doesn't know about can now be restored
# stale. See the `desktopTest` input declaration in shared/build.gradle.kts.
org.gradle.caching=true
